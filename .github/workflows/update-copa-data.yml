name: Atualizar dados da Copa 2026

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch-espn.mjs"
      - ".github/workflows/update-copa-data.yml"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Atualizar dados ESPN
        run: node scripts/fetch-espn.mjs

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/espn-scoreboard.json
          git diff --cached --quiet || git commit -m "Atualiza dados automáticos da Copa"
          git push
