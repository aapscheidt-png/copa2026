<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copa 2026">
<title>Copa do Mundo 2026 · Pscheidt</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F5C518;--gold2:#E8A800;--gold-dim:rgba(245,197,24,0.12);
  --dark:#070C18;--dark2:#0D1523;--dark3:#131C2E;--card:#101826;
  --card2:#161E30;--border:rgba(245,197,24,0.14);--border2:rgba(255,255,255,0.06);
  --text:#E8EAF0;--text3:#6B7280;
  --live:#EF4444;--live-dim:rgba(239,68,68,0.12);
  --green:#22C55E;--green-dim:rgba(34,197,94,0.12);
  --ycard:#FBBF24;--rcard:#EF4444;
  --brazil:#009c3b;--brazil-dim:rgba(0,156,59,0.13);
  --r:13px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--dark);overscroll-behavior:none}
body{color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;padding-bottom:72px;overflow-x:hidden}
/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,21,35,0.97);border-top:1px solid var(--border);display:flex;z-index:300;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(16px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px 7px;cursor:pointer;border:none;background:none;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;gap:2px;transition:color .2s;position:relative}
.nav-btn .ni{font-size:19px;line-height:1;transition:transform .2s}
.nav-btn.active{color:var(--gold)}
.nav-btn.active .ni{transform:scale(1.1);filter:drop-shadow(0 0 5px rgba(245,197,24,.5))}
.nav-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--gold);border-radius:0 0 3px 3px}
/* HEADER */
.hdr{background:linear-gradient(180deg,var(--dark2) 0%,rgba(7,12,24,0) 100%);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,0) 14px 0;position:sticky;top:0;z-index:200;backdrop-filter:blur(16px)}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;padding-top:12px;margin-bottom:10px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:2.5px;color:var(--gold);line-height:1}
.logo-sub{font-size:9px;color:var(--text3);letter-spacing:.5px;font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.logo-sub span{color:rgba(245,197,24,.7);font-weight:700}
.hdr-right{display:flex;align-items:center;gap:7px}
.live-pill{background:var(--live);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;letter-spacing:1.2px;padding:3px 7px;border-radius:4px;animation:pulse 1.5s infinite;display:none}
.live-pill.on{display:block}
.refresh-btn{background:none;border:1px solid var(--border);color:var(--gold);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.refresh-btn.spin{animation:spin .9s linear infinite}
.upd-row{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--text3);padding-bottom:9px;display:flex;justify-content:space-between}
.upd-row a{color:var(--gold);text-decoration:none;font-size:9px}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:9px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:none;border:1px solid var(--border);color:var(--text3);padding:5px 12px;border-radius:20px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;transition:all .18s;white-space:nowrap}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--dark)}
/* ANIMATIONS */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* PAGES */
.pg{display:none;padding:10px 11px 6px;animation:fadeUp .22s ease}
.pg.on{display:block}
.sh{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--gold);margin:14px 2px 7px;display:flex;align-items:center;gap:7px}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}
/* MATCH CARD */
.mc{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:11px 12px;margin-bottom:7px;position:relative;overflow:hidden;cursor:pointer}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.mc.live{border-color:rgba(239,68,68,.3)}.mc.live::before{background:var(--live)}
.mc.finished::before{background:var(--green)}
.mc.upcoming::before{background:var(--gold-dim)}
.mc.br{border-color:rgba(0,156,59,.3);background:var(--brazil-dim)}.mc.br::before{background:var(--brazil)!important}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mc-grp{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase}
.mc-st{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.ms-live{background:var(--live);color:#fff;animation:pulse 1.5s infinite}
.ms-done{background:var(--green-dim);color:var(--green)}
.ms-up{color:var(--text3)}
.mc-row{display:flex;align-items:center;gap:6px}
.mc-side{flex:1;display:flex;align-items:center;gap:6px}
.mc-side.r{flex-direction:row-reverse;text-align:right}
.mc-fl{font-size:22px;line-height:1;flex-shrink:0}
.mc-nm{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);line-height:1.2}
.mc-nm.win{color:var(--gold)}
.sc-box{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sc{font-family:'Bebas Neue',sans-serif;font-size:25px;line-height:1;min-width:19px;text-align:center}
.sc.win{color:var(--gold)}
.sc-d{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--text3);line-height:1}
.tt{font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--gold);white-space:nowrap}
.mc-venue{margin-top:7px;font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px}
.mc-venue::before{content:'📍';font-size:9px}
.mc-timer{display:flex;align-items:center;gap:5px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(239,68,68,.15)}
.timer-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1s infinite;flex-shrink:0}
.timer-val{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--live);letter-spacing:1px}
.timer-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--live),#FF6B6B);border-radius:2px}
.tap-hint{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--text3);margin-top:5px;letter-spacing:.5px}
.dh{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--text3);text-transform:uppercase;padding:9px 2px 4px}
.today-lbl{color:var(--gold)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:flex;align-items:flex-end;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.on{opacity:1;pointer-events:all}
.modal{background:var(--dark2);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.modal-overlay.on .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0}
.modal-hdr{padding:14px 16px 12px;border-bottom:1px solid var(--border2)}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--gold)}
.modal-teams{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.mt-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.mt-fl{font-size:34px;line-height:1}
.mt-nm{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);text-align:center}
.mt-score-box{display:flex;align-items:center;gap:6px;flex-shrink:0}
.mt-sc{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--gold);line-height:1;min-width:28px;text-align:center}
.mt-sc.win{color:var(--gold)}
.mt-sc-d{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--text3);line-height:1}
.mt-sc-time{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold)}
.modal-timer-bar{background:var(--live-dim);border:1px solid rgba(239,68,68,.25);border-radius:8px;margin:10px 16px 0;padding:8px 12px;display:flex;align-items:center;gap:8px}
.modal-timer-bar .td{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1s infinite;flex-shrink:0}
.modal-timer-bar .tv{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--live);letter-spacing:1px}
.modal-timer-bar .tbw{flex:1;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.modal-timer-bar .tb{height:100%;background:var(--live);border-radius:2px}
.modal-timer-bar .tp{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text3)}
.modal-body{padding:12px 16px}
.modal-venue{background:var(--dark3);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.modal-venue::before{content:'📍';font-size:14px}
.mv-txt{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text);font-weight:700}
.mv-sub{font-size:10px;color:var(--text3);margin-top:1px}
.modal-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mi{background:var(--dark3);border-radius:8px;padding:9px 10px;text-align:center}
.mi-val{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--gold);line-height:1}
.mi-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text3);letter-spacing:.5px;margin-top:2px}
.modal-sec{margin-bottom:14px}
.modal-sec-title{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--text3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.modal-sec-title::after{content:'';flex:1;height:1px;background:var(--border2)}
.ev-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.025);font-family:'Barlow Condensed',sans-serif;font-size:12px}
.ev-row:last-child{border-bottom:none}
.ev-min{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:13px;min-width:28px}
.ev-icon{font-size:13px;min-width:18px;text-align:center}
.ev-name{flex:1;color:var(--text);font-weight:700}
.ev-team{color:var(--text3);font-size:10px}
.no-data{text-align:center;padding:16px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:12px}
/* STANDINGS */
.grp-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.grp-hdr{background:linear-gradient(90deg,var(--dark3),var(--card2));padding:10px 13px;display:flex;align-items:center;gap:8px;cursor:pointer}
.grp-hdr h3{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:var(--gold)}
.grp-flags{font-size:15px;display:flex;gap:3px}
.grp-arrow{margin-left:auto;color:var(--text3);font-size:11px;transition:transform .2s}
.grp-card.open .grp-arrow{transform:rotate(180deg)}
.st-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.st{width:100%;border-collapse:collapse;min-width:360px}
.st thead th{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;padding:7px;text-align:center;border-bottom:1px solid var(--border2);white-space:nowrap}
.st thead th:first-child{text-align:left;padding-left:10px;min-width:140px}
.st tbody td{padding:8px 7px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.03)}
.st tbody td:first-child{text-align:left;padding-left:0}
.st tbody tr:last-child td{border-bottom:none}
.st tbody tr.live-row td{background:rgba(239,68,68,.04)}
.st-tm{display:flex;align-items:center;gap:6px;padding-left:8px}
.pos{font-family:'Bebas Neue',sans-serif;font-size:14px;width:13px;color:var(--text3);flex-shrink:0}
.pos.p1{color:var(--green)}.pos.p2{color:var(--gold)}.pos.p3{color:#60A5FA}
.st-fl{font-size:17px;line-height:1}
.st-nm{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:85px}
.pts-cell{color:var(--gold);font-weight:800;font-size:14px}
.sg-pos{color:var(--green)}.sg-neg{color:var(--live)}
.form-row{display:flex;gap:2px;justify-content:center}
.fd{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;font-family:'Barlow Condensed',sans-serif}
.fd-w{background:var(--green);color:#fff}.fd-d{background:#4B5563;color:#fff}.fd-l{background:var(--live);color:#fff}
.fd-lv{background:var(--live);color:#fff;animation:pulse 1s infinite}
.st-legend{display:flex;gap:14px;padding:8px 12px;border-top:1px solid var(--border2);font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text3)}
.ld{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
.grp-matches{padding:4px 10px 10px;border-top:1px solid var(--border2)}
.gmt{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--gold);padding:8px 2px 5px}
.gm-row{display:flex;align-items:center;gap:4px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.025);cursor:pointer}
.gm-row:last-child{border-bottom:none}
.gm-home{flex:1;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.gm-away{flex:1;display:flex;align-items:center;gap:4px}
.gm-hn,.gm-an{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text)}
.gm-hn{text-align:right}
.gm-score{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--gold);min-width:38px;text-align:center;white-space:nowrap}
.gm-dt{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text3);min-width:32px;text-align:center}
/* STATS */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:14px 12px;text-align:center}
.kpi.wide{grid-column:1/-1}
.kpi-n{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--gold);line-height:1}
.kpi-l{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text3);letter-spacing:.9px;text-transform:uppercase;margin-top:3px}
.kpi-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text3);margin-top:4px}
.prog-bar{background:var(--dark3);border-radius:5px;height:7px;overflow:hidden;margin-top:8px}
.prog-fill{background:linear-gradient(90deg,var(--gold),var(--gold2));height:100%;border-radius:5px;transition:width .6s}
.list-blk{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.lb-hdr{background:var(--dark3);padding:9px 13px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:7px}
.lb-hdr h3{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--gold)}
.lb-hdr .lhi{font-size:16px}
.lb-hdr .api-src{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--text3)}
.li{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.028)}
.li:last-child{border-bottom:none}
.li-rk{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--text3);width:18px;text-align:center;flex-shrink:0}
.li-rk.top{color:var(--gold)}
.li-fl{font-size:19px;flex-shrink:0}
.li-inf{flex:1;min-width:0}
.li-nm{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sb{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text3);margin-top:1px}
.li-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);flex-shrink:0}
.li-bar-wrap{flex:1;max-width:90px}
.li-bar{height:5px;background:var(--gold);border-radius:3px;min-width:3px}
.info-tbl{width:100%;font-family:'Barlow Condensed',sans-serif;font-size:13px}
.info-tbl tr td{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.03)}
.info-tbl tr:last-child td{border-bottom:none}
.info-tbl td:first-child{color:var(--text3);width:50%}
.info-tbl td:last-child{color:var(--text);font-weight:700;text-align:right}
.stat-cmp{margin-bottom:8px}
.stat-cmp-row{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text3);margin-bottom:3px}
.stat-cmp-row span:first-child,.stat-cmp-row span:last-child{color:var(--gold);font-weight:700;min-width:22px}
.stat-cmp-row span:last-child{text-align:right}
.stat-cmp-bars{display:flex;gap:2px;height:4px}
.stat-bar-h{background:var(--gold);border-radius:2px 0 0 2px}
.stat-bar-a{background:var(--dark3);border-radius:0 2px 2px 0}
/* MISC */
.tip{background:var(--dark3);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin:10px 0 6px;font-size:11px;color:var(--text3);line-height:1.6}
.tip strong{color:var(--gold)}
.api-warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);border-radius:8px;padding:7px 11px;font-size:11px;color:#FCA5A5;margin-bottom:8px;font-family:'Barlow Condensed',sans-serif;display:none}
.api-warn.on{display:block}
.loading-box{text-align:center;padding:50px 20px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.8px}
.spin-ic{font-size:34px;display:block;margin-bottom:12px;animation:bounce .85s infinite}
.empty{text-align:center;padding:28px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:13px}
.src{text-align:center;font-size:10px;color:var(--text3);padding:14px 12px 0;line-height:1.7}
.src a{color:var(--gold);text-decoration:none}

/* V8 - cartões visíveis na aba Stats */
.li-cards{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:54px}
.yc,.rc{display:inline-block;width:10px;height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.yc{background:var(--ycard)}
.rc{background:var(--rcard)}
.stat-note{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text3);padding:8px 13px;border-top:1px solid rgba(255,255,255,.04)}
.stat-note b{color:var(--gold)}


/* V8 - estatísticas avançadas */
.stat-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat-mini{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:10px 7px;text-align:center}
.stat-mini-n{font-family:'Bebas Neue',sans-serif;font-size:25px;color:var(--gold);line-height:1}

<style id="v3-expandable-css">
